

name: Build Creator Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'CreatorStudio-Android-Source (1).zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q "CreatorStudio-Android-Source (1).zip" -d project
          find project -name settings.gradle.kts

      - name: Locate Android project
        run: |
          FILE=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorStudio-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
